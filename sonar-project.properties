# Configuración del análisis de SonarCloud (análisis por CI desde
# azure-pipelines.yml, etapa CalidadSonar). Reemplaza al antiguo
# .sonarcloud.properties del análisis automático.
sonar.organization=ccastellanosf-umg
sonar.projectKey=ccastellanosf-umg_panaderia-el-frutal
sonar.projectName=Panadería El Frutal
sonar.sourceEncoding=UTF-8

# Código fuente: todo el repositorio, con el mismo alcance que el análisis
# inicial (servicios, frontend, SQL, scripts, Dockerfiles, Jenkinsfile y
# azure-pipelines.yml). Las pruebas se indexan aparte, como pruebas.
sonar.sources=.
sonar.tests=tests,src/frontend/tests
sonar.test.inclusions=tests/**/*.js,src/frontend/tests/**/*.{js,jsx}

# docs/ contiene documentación y evidencia generada (reportes k6, JUnit,
# capturas), no código de la aplicación. Las carpetas de pruebas se excluyen
# de las fuentes porque ya se indexan como pruebas.
sonar.exclusions=docs/**,**/node_modules/**,**/coverage/**,**/dist/**,test-results/**,tests/**,src/frontend/tests/**

# Archivos que no cuentan para la cobertura: arranque de servidores,
# configuración de pruebas y bootstrap del frontend.
sonar.coverage.exclusions=src/*/index.js,src/*/jest.config.js,src/frontend/src/main.jsx,src/frontend/vite.config.js

# Duplicación: cada microservicio se construye y despliega por separado (su
# propia imagen Docker y su propio App Service) y no comparte código en
# tiempo de ejecución, así que los módulos transversales se replican a
# propósito en cada servicio: telemetría, verificación del token, manejo
# de errores async, cabeceras de seguridad, revocación de tokens, acceso a
# la base de datos y saneamiento de logs. Las migraciones SQL repiten
# sentencias del esquema porque se aplican sobre bases existentes. Todos
# estos archivos se siguen analizando (bugs, vulnerabilidades y code
# smells); solo se omite la detección de duplicados. Mejora futura:
# extraer un paquete común.
sonar.cpd.exclusions=src/*/lib/telemetria.js,src/*/middlewares/verificarToken.js,src/*/lib/asyncErrors.js,src/*/lib/seguridad.js,src/*/lib/tokensRevocados.js,src/*/lib/db.js,src/*/lib/log.js,db/migrations/**
