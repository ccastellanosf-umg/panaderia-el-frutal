# SonarCloud automatic analysis settings.
# docs/ holds documentation and generated evidence (k6 HTML reports,
# JUnit XML, screenshots), not project source code, so it is excluded
# to keep the quality metrics about the application only.
sonar.exclusions=docs/**

# Each microservice is built and deployed on its own (pedidos and pagos copy
# only src/<service> into the image), so the small telemetry bootstrap is
# intentionally repeated per service instead of shared. It is still analyzed
# for bugs and vulnerabilities; only duplication detection skips it.
sonar.cpd.exclusions=src/*/lib/telemetria.js
