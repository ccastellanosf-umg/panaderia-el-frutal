# ============================================================
# docker-compose.yml
# Transformación Digital de Panadería El Frutal — Grupo 3
# ============================================================
# Orquesta los cuatro microservicios (auth, catalogo, pedidos,
# pagos), la base de datos PostgreSQL y Redis (usado por auth para
# invalidar tokens y por catálogo como caché de lecturas frecuentes).
#
# Los cuatro microservicios están completamente implementados
# (Fase 1). El esquema y los datos semilla se cargan desde db/
# (01_schema.sql, 02_seed.sql) vía docker-entrypoint-initdb.d.

services:
  db:
    image: postgres:16-alpine
    container_name: elfrutal_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-panaderia_el_frutal}
      POSTGRES_USER: ${DB_USER:-elfrutal_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-elfrutal_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elfrutal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: docker/auth/Dockerfile
    container_name: elfrutal_auth
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-elfrutal_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-panaderia_el_frutal}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  catalogo:
    build:
      context: .
      dockerfile: docker/catalogo/Dockerfile
    container_name: elfrutal_catalogo
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-elfrutal_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-panaderia_el_frutal}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3002
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pedidos:
    build:
      context: .
      dockerfile: docker/pedidos/Dockerfile
    container_name: elfrutal_pedidos
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-elfrutal_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-panaderia_el_frutal}
      JWT_SECRET: ${JWT_SECRET}
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-}
      PORT: 3003
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3003/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

  pagos:
    build:
      context: .
      dockerfile: docker/pagos/Dockerfile
    container_name: elfrutal_pagos
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${DB_USER:-elfrutal_admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-panaderia_el_frutal}
      JWT_SECRET: ${JWT_SECRET}
      PASARELA_MODO: ${PASARELA_MODO:-simulada}
      PORT: 3004
    ports:
      - "3004:3004"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3004/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
    driver: local
