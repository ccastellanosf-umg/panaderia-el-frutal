# ============================================================
# azure-pipelines.yml
# Transformación Digital de Panadería El Frutal — Grupo 3
# ============================================================
# Pipeline de integración y despliegue continuo sobre los cuatro
# microservicios (auth, catalogo, pedidos, pagos) y el frontend.
#
# Orden de las etapas:
#   1. Build           instalación y compilación
#   2. Test            pruebas unitarias con cobertura (Jest y Vitest)
#   3. CalidadSonar    análisis estático en SonarCloud y quality gate
#   4. PruebasAPI      pruebas de API (Postman + Newman) sobre un stack
#                      desechable de docker compose
#   5. Deploy          despliegue a Azure (solo main)
#
# Estrategia de ramas: dev (integración) -> qa (validación) -> main
# (producción). Los Pull Requests y los pushes a dev y qa ejecutan
# Build, Test y CalidadSonar; Deploy a Azure solo se ejecuta al fusionar
# a main. Si el quality gate de SonarCloud falla, el pipeline falla y no
# se despliega.

trigger:
  branches:
    include:
      - main
      - qa
      - dev

pr:
  branches:
    include:
      - main
      - qa
      - dev

variables:
  azureSubscription: 'Conexion-ElFrutal-G3'
  resourceGroupName: 'rg-elfrutal-transformacion-digital'
  acrName: 'acrelfrutalg3'
  staticWebAppName: 'swa-elfrutal-frontend-g3'
  frontendDirectory: 'src/frontend'

stages:

  # ------------------------------------------------------------
  # ETAPA 1: BUILD — los cuatro microservicios + frontend
  # ------------------------------------------------------------
  - stage: Build
    displayName: 'Build de los microservicios y el frontend'
    jobs:
      - job: BuildMicroservicios
        displayName: 'Build de microservicios (matriz)'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              usaPrisma: 'true'
            catalogo:
              serviceName: 'catalogo'
              usaPrisma: 'true'
            pedidos:
              serviceName: 'pedidos'
              usaPrisma: 'false'
            pagos:
              serviceName: 'pagos'
              usaPrisma: 'false'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20'

          - script: npm ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias de $(serviceName)'

          - script: npx prisma generate
            workingDirectory: 'src/$(serviceName)'
            condition: eq(variables['usaPrisma'], 'true')
            displayName: 'Generar cliente Prisma de $(serviceName)'

      - job: BuildFrontend
        displayName: 'Build del frontend (React + Vite)'
        pool:
          name: 'Default'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20'

          - script: npm ci
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Instalar dependencias del frontend'

          - script: npm run build
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Compilar el frontend'
            env:
              VITE_AUTH_URL: 'https://app-elfrutal-auth-g3.azurewebsites.net'
              VITE_CATALOGO_URL: 'https://app-elfrutal-catalogo-g3.azurewebsites.net'
              VITE_PEDIDOS_URL: 'https://app-elfrutal-pedidos-g3.azurewebsites.net'
              VITE_PAGOS_URL: 'https://app-elfrutal-pagos-g3.azurewebsites.net'

          - publish: '$(frontendDirectory)/build'
            artifact: 'frontend-build'
            displayName: 'Publicar artefacto frontend-build'

  # ------------------------------------------------------------
  # ETAPA 2: TEST — pruebas unitarias de los microservicios
  # ------------------------------------------------------------
  - stage: Test
    displayName: 'Pruebas unitarias'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Pruebas unitarias (Jest) por microservicio'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              usaPrisma: 'true'
            catalogo:
              serviceName: 'catalogo'
              usaPrisma: 'true'
            pedidos:
              serviceName: 'pedidos'
              usaPrisma: 'false'
            pagos:
              serviceName: 'pagos'
              usaPrisma: 'false'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias de $(serviceName)'

          - script: npx prisma generate
            workingDirectory: 'src/$(serviceName)'
            condition: eq(variables['usaPrisma'], 'true')
            displayName: 'Generar cliente Prisma de $(serviceName)'

          - script: npm --prefix ../.. ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias compartidas de pruebas (supertest)'

          - script: npx jest $(serviceName).test.js --roots ../../tests --ci --forceExit --coverage
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Ejecutar pruebas de $(serviceName) con cobertura'
            env:
              JWT_SECRET: 'clave-de-pruebas-no-productiva'

          # Jest genera rutas relativas al servicio (SF:app.js); SonarCloud
          # las necesita relativas a la raíz del repositorio. perl -pi es
          # portable (el agente es macOS: sed -i de GNU no funciona).
          - script: perl -pi -e 's#^SF:#SF:src/$(serviceName)/#' coverage/lcov.info
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Reescribir rutas de cobertura de $(serviceName)'

          - publish: 'src/$(serviceName)/coverage/lcov.info'
            artifact: 'coverage-$(serviceName)'
            displayName: 'Publicar cobertura de $(serviceName)'

      - job: UnitTestsFrontend
        displayName: 'Pruebas unitarias (Vitest) del frontend'
        pool:
          name: 'Default'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20'

          - script: npm ci
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Instalar dependencias del frontend'

          - script: npm run test:coverage
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Ejecutar pruebas del frontend con cobertura'

          # Mismo ajuste de rutas que en los microservicios (ver arriba).
          - script: perl -pi -e 's#^SF:#SF:src/frontend/#' coverage/lcov.info
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Reescribir rutas de cobertura del frontend'

          - publish: '$(frontendDirectory)/coverage/lcov.info'
            artifact: 'coverage-frontend'
            displayName: 'Publicar cobertura del frontend'

  # ------------------------------------------------------------
  # ETAPA 3: CALIDAD — análisis estático en SonarCloud y quality gate
  # ------------------------------------------------------------
  - stage: CalidadSonar
    displayName: 'Análisis estático (SonarCloud) y quality gate'
    dependsOn: Test
    jobs:
      - job: SonarCloud
        displayName: 'Análisis de SonarCloud y verificación del quality gate'
        pool:
          name: 'Default'
        steps:
          # fetchDepth 0: SonarCloud necesita el historial completo para
          # atribuir el código nuevo y los blames correctamente.
          - checkout: self
            fetchDepth: 0

          # Los reportes se descargan a $(Pipeline.Workspace)/coverage/<nombre>
          # y Sonar los lee directamente desde ahí (sus rutas SF: ya son
          # relativas a la raíz del repositorio), sin copiarlos al código.
          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar cobertura de auth'
            inputs:
              artifact: 'coverage-auth'
              path: '$(Pipeline.Workspace)/coverage/auth'
          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar cobertura de catalogo'
            inputs:
              artifact: 'coverage-catalogo'
              path: '$(Pipeline.Workspace)/coverage/catalogo'
          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar cobertura de pedidos'
            inputs:
              artifact: 'coverage-pedidos'
              path: '$(Pipeline.Workspace)/coverage/pedidos'
          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar cobertura de pagos'
            inputs:
              artifact: 'coverage-pagos'
              path: '$(Pipeline.Workspace)/coverage/pagos'
          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar cobertura del frontend'
            inputs:
              artifact: 'coverage-frontend'
              path: '$(Pipeline.Workspace)/coverage/frontend'

          - task: SonarCloudPrepare@3
            displayName: 'Preparar análisis de SonarCloud'
            inputs:
              SonarCloud: 'SonarCloud-ElFrutal'
              organization: 'ccastellanosf-umg'
              scannerMode: 'cli'
              configMode: 'file'   # lee sonar-project.properties
              extraProperties: |
                sonar.javascript.lcov.reportPaths=$(Pipeline.Workspace)/coverage/auth/lcov.info,$(Pipeline.Workspace)/coverage/catalogo/lcov.info,$(Pipeline.Workspace)/coverage/pedidos/lcov.info,$(Pipeline.Workspace)/coverage/pagos/lcov.info,$(Pipeline.Workspace)/coverage/frontend/lcov.info
                sonar.qualitygate.wait=true

          # Con sonar.qualitygate.wait=true, este paso falla el job si el
          # quality gate no se cumple.
          - task: SonarCloudAnalyze@3
            displayName: 'Ejecutar análisis de SonarCloud'

          - task: SonarCloudPublish@3
            displayName: 'Publicar resultado del quality gate'
            inputs:
              pollingTimeoutSec: '300'

  # ------------------------------------------------------------
  # ETAPA 4: PRUEBAS DE API — colección de Postman ejecutada con Newman
  # ------------------------------------------------------------
  - stage: PruebasAPI
    displayName: 'Pruebas de API (Postman + Newman)'
    dependsOn: CalidadSonar
    jobs:
      - job: Newman
        displayName: 'Colección de Postman con Newman sobre docker compose'
        pool:
          name: 'Default'
        steps:
          # El script levanta un stack desechable, corre Newman dentro de
          # la red de compose y siempre lo destruye al terminar.
          - script: bash scripts/ci/api-tests.sh
            displayName: 'Ejecutar las pruebas de API'

          - task: PublishTestResults@2
            displayName: 'Publicar resultados de las pruebas de API'
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'test-results/api/newman-junit.xml'
              testRunTitle: 'Pruebas de API (Newman)'

  # ------------------------------------------------------------
  # ETAPA 5: DEPLOY (solo main; solo servicios del Sprint 1)
  # ------------------------------------------------------------
  - stage: Deploy
    displayName: 'Despliegue a Azure (los cuatro microservicios)'
    dependsOn: PruebasAPI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployMicroservicios
        displayName: 'Build de imágenes y despliegue en Azure App Service'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              appServiceName: 'app-elfrutal-auth-g3'
            catalogo:
              serviceName: 'catalogo'
              appServiceName: 'app-elfrutal-catalogo-g3'
            pedidos:
              serviceName: 'pedidos'
              appServiceName: 'app-elfrutal-pedidos-g3'
            pagos:
              serviceName: 'pagos'
              appServiceName: 'app-elfrutal-pagos-g3'
        steps:
          - task: AzureCLI@2
            displayName: 'Build y push de la imagen de $(serviceName) a ACR (linux/amd64)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export DOCKER_BUILDKIT=1
                az acr login --name $(acrName)
                docker buildx build --platform linux/amd64 -f docker/$(serviceName)/Dockerfile -t $(acrName).azurecr.io/elfrutal-$(serviceName):$(Build.BuildId) -t $(acrName).azurecr.io/elfrutal-$(serviceName):latest --push .

          - task: AzureWebAppContainer@1
            displayName: 'Desplegar $(serviceName) en Azure App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appServiceName)'
              resourceGroupName: '$(resourceGroupName)'
              imageName: '$(acrName).azurecr.io/elfrutal-$(serviceName):$(Build.BuildId)'

      - job: DeployFrontend
        displayName: 'Despliegue del frontend en Azure Static Web Apps'
        pool:
          name: 'Default'
        steps:
          - download: current
            artifact: 'frontend-build'
            displayName: 'Descargar artefacto frontend-build'

          - task: AzureStaticWebApp@0
            displayName: 'Desplegar frontend en $(staticWebAppName)'
            inputs:
              # The task mounts only `cwd` into its container, so it must
              # point at the workspace where the artifact is downloaded.
              cwd: '$(Pipeline.Workspace)'
              app_location: 'frontend-build'
              skip_app_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)

