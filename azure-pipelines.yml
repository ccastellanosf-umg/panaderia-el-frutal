# ============================================================
# azure-pipelines.yml
# Transformación Digital de Panadería El Frutal — Grupo 3
# ============================================================
# Pipeline básico requerido para esta entrega: Build + Test + Deploy
# sobre los cuatro microservicios (auth, catalogo, pedidos, pagos),
# todos completamente implementados en la Fase 1.
#
# Estrategia de ramas: GitHub Flow. Los Pull Requests disparan
# únicamente Build y Test; Deploy solo se ejecuta al fusionar a main.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  azureSubscription: 'Conexion-ElFrutal-G3'
  resourceGroupName: 'rg-elfrutal-transformacion-digital'
  acrName: 'acrelfrutalg3'
  staticWebAppName: 'swa-elfrutal-frontend-g3'
  frontendDirectory: 'src/frontend'

stages:

  # ------------------------------------------------------------
  # ETAPA 1: BUILD — los cuatro microservicios + frontend
  # ------------------------------------------------------------
  - stage: Build
    displayName: 'Build de los microservicios y el frontend'
    jobs:
      - job: BuildMicroservicios
        displayName: 'Build de microservicios (matriz)'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              usaPrisma: 'true'
            catalogo:
              serviceName: 'catalogo'
              usaPrisma: 'true'
            pedidos:
              serviceName: 'pedidos'
              usaPrisma: 'false'
            pagos:
              serviceName: 'pagos'
              usaPrisma: 'false'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20'

          - script: npm ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias de $(serviceName)'

          - script: npx prisma generate
            workingDirectory: 'src/$(serviceName)'
            condition: eq(variables['usaPrisma'], 'true')
            displayName: 'Generar cliente Prisma de $(serviceName)'

      - job: BuildFrontend
        displayName: 'Build del frontend (React + Vite)'
        pool:
          name: 'Default'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'
            displayName: 'Instalar Node.js 20'

          - script: npm ci
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Instalar dependencias del frontend'

          - script: npm test
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Ejecutar pruebas del frontend (Vitest)'

          - script: npm run build
            workingDirectory: '$(frontendDirectory)'
            displayName: 'Compilar el frontend'
            env:
              VITE_AUTH_URL: 'https://app-elfrutal-auth-g3.azurewebsites.net'
              VITE_CATALOGO_URL: 'https://app-elfrutal-catalogo-g3.azurewebsites.net'
              VITE_PEDIDOS_URL: 'https://app-elfrutal-pedidos-g3.azurewebsites.net'
              VITE_PAGOS_URL: 'https://app-elfrutal-pagos-g3.azurewebsites.net'

          - publish: '$(frontendDirectory)/build'
            artifact: 'frontend-build'
            displayName: 'Publicar artefacto frontend-build'

  # ------------------------------------------------------------
  # ETAPA 2: TEST — pruebas unitarias de los microservicios
  # ------------------------------------------------------------
  - stage: Test
    displayName: 'Pruebas unitarias'
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: 'Pruebas unitarias (Jest) por microservicio'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              usaPrisma: 'true'
            catalogo:
              serviceName: 'catalogo'
              usaPrisma: 'true'
            pedidos:
              serviceName: 'pedidos'
              usaPrisma: 'false'
            pagos:
              serviceName: 'pagos'
              usaPrisma: 'false'
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: '20.x'

          - script: npm ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias de $(serviceName)'

          - script: npx prisma generate
            workingDirectory: 'src/$(serviceName)'
            condition: eq(variables['usaPrisma'], 'true')
            displayName: 'Generar cliente Prisma de $(serviceName)'

          - script: npm --prefix ../.. ci
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Instalar dependencias compartidas de pruebas (supertest)'

          - script: npx jest $(serviceName).test.js --roots ../../tests --ci --forceExit
            workingDirectory: 'src/$(serviceName)'
            displayName: 'Ejecutar pruebas de $(serviceName)'
            env:
              JWT_SECRET: 'clave-de-pruebas-no-productiva'

  # ------------------------------------------------------------
  # ETAPA 3: DEPLOY (solo main; solo servicios del Sprint 1)
  # ------------------------------------------------------------
  - stage: Deploy
    displayName: 'Despliegue a Azure (los cuatro microservicios)'
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: DeployMicroservicios
        displayName: 'Build de imágenes y despliegue en Azure App Service'
        pool:
          name: 'Default'
        strategy:
          matrix:
            auth:
              serviceName: 'auth'
              appServiceName: 'app-elfrutal-auth-g3'
            catalogo:
              serviceName: 'catalogo'
              appServiceName: 'app-elfrutal-catalogo-g3'
            pedidos:
              serviceName: 'pedidos'
              appServiceName: 'app-elfrutal-pedidos-g3'
            pagos:
              serviceName: 'pagos'
              appServiceName: 'app-elfrutal-pagos-g3'
        steps:
          - task: AzureCLI@2
            displayName: 'Build y push de la imagen de $(serviceName) a ACR (linux/amd64)'
            inputs:
              azureSubscription: '$(azureSubscription)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                export DOCKER_BUILDKIT=1
                az acr login --name $(acrName)
                docker buildx build --platform linux/amd64 -f docker/$(serviceName)/Dockerfile -t $(acrName).azurecr.io/elfrutal-$(serviceName):$(Build.BuildId) -t $(acrName).azurecr.io/elfrutal-$(serviceName):latest --push .

          - task: AzureWebAppContainer@1
            displayName: 'Desplegar $(serviceName) en Azure App Service'
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appServiceName)'
              resourceGroupName: '$(resourceGroupName)'
              imageName: '$(acrName).azurecr.io/elfrutal-$(serviceName):$(Build.BuildId)'

      - job: DeployFrontend
        displayName: 'Despliegue del frontend en Azure Static Web Apps'
        pool:
          name: 'Default'
        steps:
          - download: current
            artifact: 'frontend-build'
            displayName: 'Descargar artefacto frontend-build'

          - task: AzureStaticWebApp@0
            displayName: 'Desplegar frontend en $(staticWebAppName)'
            inputs:
              # The task mounts only `cwd` into its container, so it must
              # point at the workspace where the artifact is downloaded.
              cwd: '$(Pipeline.Workspace)'
              app_location: 'frontend-build'
              skip_app_build: true
              azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)

